        const StorageService = {
            get(key, fallback) {
                try {
                    const item = localStorage.getItem(`apoioja_${key}`);
                    return item ? JSON.parse(item) : fallback;
                } catch (e) {
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(`apoioja_${key}`, JSON.stringify(value));
                } catch (e) {}
            },
            initSeed() {
                if (!localStorage.getItem("apoioja_teachers")) {
                    localStorage.setItem("apoioja_teachers", JSON.stringify(INITIAL_PROFESSORS));
                }
                if (!localStorage.getItem("apoioja_requests")) {
                    localStorage.setItem("apoioja_requests", JSON.stringify([
                        {
                            id: "req-1",
                            professorId: "prof-1",
                            professorNome: "Mário dos Santos",
                            alunoNome: "Estudante Demo",
                            disciplina: "Matemática",
                            nivel: "I Ciclo do Ensino Secundário (7.ª–9.ª)",
                            duvida: "Preciso de ajuda com equações do 2º grau e raízes quadradas para o teste trimestral.",
                            modalidade: "Chat online",
                            estado: "Aceite",
                            data: new Date(Date.now() - 3600000 * 2).toISOString()
                        }
                    ]));
                }
                if (!localStorage.getItem("apoioja_messages")) {
                    localStorage.setItem("apoioja_messages", JSON.stringify({

                if (!localStorage.getItem("apoioja_favorites")) {
                    localStorage.setItem("apoioja_favorites", JSON.stringify(["prof-1", "prof-4"]));
                }
            }
        };

        StorageService.initSeed();

            const [theme, setTheme] = useState('light'); // 'light' | 'dark' | 'midnight' | 'sunset'

            const [viewMode, setViewMode] = useState("aluno");
            const [currentPage, setCurrentPage] = useState("home");
            const [selectedProfId, setSelectedProfId] = useState(null);
            const [selectedRequestId, setSelectedRequestId] = useState(null);

            const showToast = (msg, type = "success") => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            const resetData = () => {
                if (confirm("Tem certeza que deseja repor todos os dados iniciais de demonstração?")) {
                    localStorage.clear();
                    StorageService.initSeed();
                    window.location.reload();
                }
            };

            const navigate = (page, param = null) => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (page === 'perfil') setSelectedProfId(param);
                if (page === 'chat') setSelectedRequestId(param);
                setCurrentPage(page);
            };

            useEffect(() => {
                if (window.lucide) {
                    setTimeout(() => window.lucide.createIcons(), 50);
                }

                if (theme === 'dark') return 'bg-slate-950 text-slate-100';
                if (theme === 'midnight') return 'bg-indigo-950 text-indigo-50';
                if (theme === 'sunset') return 'bg-orange-950 text-orange-50';

                if (theme === 'midnight') return 'bg-indigo-900/80 border-indigo-800 text-indigo-50';
                if (theme === 'sunset') return 'bg-orange-900/80 border-orange-800 text-orange-50';
                return 'bg-white border-slate-200 text-[#0B2545]';
            };

                                    </p>
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs text-left space-y-2">

                                        <i data-lucide="sparkles" className="w-4 h-4"></i> Destaques do protótipo:
                                    </p>
                                    <ul className="space-y-1 text-slate-600 dark:text-slate-300">

                                        </button>

                    <main className="flex-1">

                        {currentPage === 'perfil' && <ProfilePage profId={selectedProfId} navigate={navigate} showToast={showToast} getCardBg={getCardBg} />}
                        {currentPage === 'pedir' && <RequestPage profId={selectedProfId} navigate={navigate} showToast={showToast} getCardBg={getCardBg} />}

                    <div className={`rounded-3xl p-8 shadow-sm border space-y-6 ${getCardBg()}`}>
                        <h2 className="text-2xl font-extrabold">Solicitar Ajuda a {prof.nome}</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 mb-1">Descreva a sua dúvida</label>
                                <textarea 
                                    rows="4" 
                                    value={duvida} 
                                    onChange={e => setDuvida(e.target.value)}
                                    placeholder="Ex: Preciso de ajuda com equações..."
                                    className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 text-sm focus:outline-none focus:border-accent"
                                ></textarea>
                            </div>
                            <button type="submit" className="w-full bg-accent hover:bg-accentHover text-white font-bold py-3.5 rounded-2xl shadow">
                                Submeter Pedido
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function StudentDashboard({ navigate, showToast, getCardBg }) {
            const requests = StorageService.get("requests", []);
            return (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <h2 className="text-3xl font-extrabold">Painel do Aluno</h2>
                    <div className="space-y-4">
                        {requests.map(req => (
                            <div key={req.id} className={`p-6 rounded-3xl border flex items-center justify-between ${getCardBg()}`}>
                                <div>
                                    <h4 className="font-bold text-base">{req.professorNome}</h4>
                                    <p className="text-xs text-slate-400">{req.disciplina} • <span className="text-accent font-bold">{req.estado}</span></p>
                                    <p className="text-xs italic mt-1">"{req.duvida}"</p>
                                </div>
                                {req.estado === 'Aceite' && (
                                    <button onClick={() => navigate('chat', req.id)} className="bg-accent text-white px-4 py-2 rounded-xl text-xs font-bold">
                                        Abrir Chat
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function TeacherDashboard({ navigate, showToast, getCardBg }) {
            const [requests, setRequests] = useState(() => StorageService.get("requests", []));
            const updateStatus = (id, estado) => {
                const updated = requests.map(r => r.id === id ? {...r, estado} : r);
                setRequests(updated);
                StorageService.set("requests", updated);
                showToast(`Pedido ${estado.toLowerCase()} com sucesso!`);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <h2 className="text-3xl font-extrabold">Painel do Professor Demo</h2>
                    <div className="space-y-4">
                        {requests.map(req => (
                            <div key={req.id} className={`p-6 rounded-3xl border flex items-center justify-between ${getCardBg()}`}>
                                <div>
                                    <h4 className="font-bold text-base">Aluno: {req.alunoNome}</h4>
                                    <p className="text-xs text-slate-400">{req.disciplina} • <span className="text-accent font-bold">{req.estado}</span></p>
                                    <p className="text-xs italic mt-1">"{req.duvida}"</p>
                                </div>
                                {req.estado === 'Pendente' && (
                                    <div className="flex gap-2">
                                        <button onClick={() => updateStatus(req.id, 'Aceite')} className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Aceitar</button>
                                        <button onClick={() => updateStatus(req.id, 'Recusado')} className="bg-rose-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Recusar</button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ChatPage({ requestId, navigate, showToast, getCardBg }) {
            const allMsg = StorageService.get("messages", {});
            const [msgList, setMsgList] = useState(allMsg[requestId] || [{ id: "1", remetente: "aluno", texto: "Olá professor!", hora: "10:00" }]);
            const [input, setInput] = useState("");

            const handleSend = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                const updated = [...msgList, { id: Date.now(), remetente: "aluno", texto: input, hora: "10:02" }];
                setMsgList(updated);
                StorageService.set("messages", { ...allMsg, [requestId]: updated });
                setInput("");
            };

            return (
                <div className="max-w-3xl mx-auto px-4 py-10">
                    <div className={`rounded-3xl border flex flex-col h-[500px] ${getCardBg()}`}>
                        <div className="p-4 border-b border-slate-200 dark:border-slate-800 font-bold">Chat com Explicador</div>
                        <div className="flex-1 p-6 overflow-y-auto space-y-3">
                            {msgList.map(m => (
                                <div key={m.id} className={`flex ${m.remetente === 'aluno' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-2xl text-xs max-w-xs ${m.remetente === 'aluno' ? 'bg-primary text-white' : 'bg-slate-200 dark:bg-slate-800'}`}>
                                        {m.texto}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <form onSubmit={handleSend} className="p-4 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                            <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Escreva..." className="flex-1 bg-slate-100 dark:bg-slate-800 border rounded-xl px-4 py-2 text-xs" />
                            <button type="submit" className="bg-accent text-white px-4 py-2 rounded-xl text-xs font-bold">Enviar</button>
                        </form>
                    </div>
                </div>
            );
        }

        function ResourcesPage({ showToast, getCardBg }) {
            return (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-6">
                    <h2 className="text-3xl font-extrabold">Recursos de Estudo</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className={`p-6 rounded-3xl border flex justify-between items-center ${getCardBg()}`}>
                            <div>
                                <h4 className="font-bold">Fórmulas de Matemática (9.ª Classe)</h4>
                                <p className="text-xs text-slate-400">PDF Educativo Alinhado</p>
                            </div>
                            <button onClick={() => showToast("Descarregado com sucesso!")} className="bg-primary text-white px-4 py-2 rounded-xl text-xs font-bold">Baixar</button>
                        </div>
                    </div>
                </div>
            );
        }

        function SecurityPage({ getCardBg }) {
            return (
                <div className="max-w-2xl mx-auto px-4 py-10">
                    <div className={`p-8 rounded-3xl border space-y-4 ${getCardBg()}`}>
                        <h2 className="text-2xl font-extrabold text-accent">Regras de Segurança</h2>
                        <p className="text-xs text-slate-400 leading-relaxed">
                            Apoio Já promove estritamente a segurança e o respeito mútuo. Aulas presenciais devem ser validadas por um encarregado de educação.
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
