<!DOCTYPE html>

<head>

    <title>Apoio Já — Conectando o Futuro de Angola</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Plataforma de apoio à aprendizagem alinhada ao currículo angolano. Encontre explicadores voluntários e acessíveis.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0B2545',
                        secondary: '#134074',
                        accent: '#F28C28',
                        accentHover: '#D97720',
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'Plus Jakarta Sans', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; font-size: 14px; }
        @media (min-width: 640px) { body { font-size: 15px; } }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(14px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(51, 65, 85, 0.8); }
        .midnight .glass-card { background: rgba(30, 27, 75, 0.9); border: 1px solid rgba(79, 70, 229, 0.3); }
        .sunset .glass-card { background: rgba(67, 20, 7, 0.9); border: 1px solid rgba(234, 88, 12, 0.3); }
        
        .hero-glow { background: radial-gradient(circle at 50% 20%, rgba(242, 140, 40, 0.15) 0%, rgba(11, 37, 69, 0.04) 60%, transparent 100%); }
        .dark .hero-glow { background: radial-gradient(circle at 50% 20%, rgba(242, 140, 40, 0.1) 0%, rgba(15, 23, 42, 0.05) 60%, transparent 100%); }
    </style>
</head>
<body class="antialiased transition-colors duration-300">

                disponibilidade: { dias: ["Terça", "Quinta"], periodos: ["Noite"] },
                online: false,
                verificado: true
            },
            {
                id: "prof-4",
                nome: "Ana Paula Guedes",
                iniciais: "AG",
                corAvatar: "bg-indigo-900 text-amber-300",
                disciplinas: ["Inglês", "Informática"],
                niveis: ["Ensino Primário (1.ª–6.ª classe)", "I Ciclo do Ensino Secundário (7.ª–9.ª)", "II Ciclo do Ensino Secundário (10.ª–12.ª/13.ª, Técnico-Profissional)"],
                provincia: "Luanda",
                acesso: "pago",
                precoKz: 15000,
                apresentacao: "Especialista em literacia digital e inglês conversacional. Metodologia moderna adaptada ao mercado angolano.",
                disponibilidade: { dias: ["Segunda", "Terça", "Quinta", "Sexta"], periodos: ["Manhã", "Tarde"] },
                online: true,

            },
            {
                id: "prof-5",
                nome: "Emanuel Tchissingui",
                iniciais: "ET",
                corAvatar: "bg-slate-800 text-teal-400",
                disciplinas: ["Geografia", "Filosofia"],
                niveis: ["I Ciclo do Ensino Secundário (7.ª–9.ª)", "II Ciclo do Ensino Secundário (10.ª–12.ª/13.ª, Técnico-Profissional)"],
                provincia: "Huambo",
                acesso: "acessivel",
                precoKz: 4000,
                apresentacao: "Licenciado em Ciências Sociais. Aulas dinâmicas com foco no pensamento crítico e geopolítica africana e mundial.",

            },
            {
                id: "prof-6",
                nome: "Rosa Ndalama",

                niveis: ["Ensino Primário (1.ª–6.ª classe)", "I Ciclo do Ensino Secundário (7.ª–9.ª)"],
                provincia: "Namibe",
                acesso: "voluntario",
                apresentacao: "Apoio escolar gratuito para crianças e adolescentes em situação de vulnerabilidade em Bairro 5 de Abril e arredores.",
                disponibilidade: { dias: ["Segunda", "Terça", "Quarta", "Quinta"], periodos: ["Tarde"] },
                online: false,
                verificado: true
            }
        ];

        const StorageService = {
            get(key, fallback) {
                try {
                    const item = localStorage.getItem(`apoioja_${key}`);
                    return item ? JSON.parse(item) : fallback;
                } catch (e) {
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(`apoioja_${key}`, JSON.stringify(value));
                } catch (e) {}
            },
            initSeed() {
                if (!localStorage.getItem("apoioja_teachers")) {
                    localStorage.setItem("apoioja_teachers", JSON.stringify(INITIAL_PROFESSORS));
                }
                if (!localStorage.getItem("apoioja_requests")) {
                    localStorage.setItem("apoioja_requests", JSON.stringify([
                        {
                            id: "req-1",
                            professorId: "prof-1",
                            professorNome: "Mário dos Santos",
                            alunoNome: "Estudante Demo",
                            disciplina: "Matemática",
                            nivel: "I Ciclo do Ensino Secundário (7.ª–9.ª)",
                            duvida: "Preciso de ajuda com equações do 2º grau e raízes quadradas para o teste trimestral.",
                            modalidade: "Chat online",
                            estado: "Aceite",
                            data: new Date(Date.now() - 3600000 * 2).toISOString()
                        }
                    ]));
                }
                if (!localStorage.getItem("apoioja_messages")) {
                    localStorage.setItem("apoioja_messages", JSON.stringify({
                        "req-1": [
                            { id: "m1", remetente: "aluno", texto: "Olá Professor Mário, tenho uma dúvida em equações.", hora: "10:15" },
                            { id: "m2", remetente: "professor", texto: "Olá! Com certeza, envia o exercício específico para começarmos.", hora: "10:17" }
                        ]
                    }));
                }
                if (!localStorage.getItem("apoioja_favorites")) {
                    localStorage.setItem("apoioja_favorites", JSON.stringify(["prof-1", "prof-4"]));
                }
            }
        };

        StorageService.initSeed();

        function App() {
            const [showWelcome, setShowWelcome] = useState(true);
            const [theme, setTheme] = useState('light'); // 'light' | 'dark' | 'midnight' | 'sunset'
            const [showThemeMenu, setShowThemeMenu] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const [viewMode, setViewMode] = useState("aluno");
            const [currentPage, setCurrentPage] = useState("home");
            const [selectedProfId, setSelectedProfId] = useState(null);
            const [selectedRequestId, setSelectedRequestId] = useState(null);
            const [searchQueryState, setSearchQueryState] = useState({ disciplina: "", provincia: "", nivel: "", acesso: "", texto: "" });
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = "success") => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            const resetData = () => {
                if (confirm("Tem certeza que deseja repor todos os dados iniciais de demonstração?")) {
                    localStorage.clear();
                    StorageService.initSeed();
                    window.location.reload();
                }
            };

            const navigate = (page, param = null) => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (page === 'perfil') setSelectedProfId(param);
                if (page === 'chat') setSelectedRequestId(param);
                setCurrentPage(page);
                setMobileMenuOpen(false);
            };

            useEffect(() => {
                if (window.lucide) {
                    setTimeout(() => window.lucide.createIcons(), 50);
                }
            }, [currentPage, viewMode, showWelcome, theme, mobileMenuOpen]);

            const getThemeClasses = () => {
                if (theme === 'dark') return 'bg-slate-950 text-slate-100 dark';
                if (theme === 'midnight') return 'bg-[#0f1026] text-indigo-50 midnight';
                if (theme === 'sunset') return 'bg-[#2b1008] text-orange-50 sunset';
                return 'bg-[#F4F6F9] text-[#0B2545]';
            };

            const getCardBg = () => {
                if (theme === 'dark') return 'bg-slate-900 border-slate-800 text-slate-100 shadow-sm';
                if (theme === 'midnight') return 'bg-[#181a3d] border-indigo-900/50 text-indigo-50 shadow-sm';
                if (theme === 'sunset') return 'bg-[#3d180d] border-orange-950/50 text-orange-50 shadow-sm';
                return 'bg-white border-slate-200/80 text-[#0B2545] shadow-sm';
            };

            return (
                <div className={`min-h-screen flex flex-col font-sans transition-all duration-300 ${getThemeClasses()}`}>
                    
                    {/* TELA DE BOAS-VINDAS */}
                    {showWelcome && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md p-4 animate-fadeIn">
                            <div className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 max-w-sm sm:max-w-md w-full rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-800 text-center space-y-5">
                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary to-accent flex items-center justify-center text-white font-bold text-xl mx-auto shadow-lg">
                                    AJ
                                </div>
                                <div className="space-y-1.5">
                                    <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Bem-vindo ao <span className="text-accent">Apoio Já</span> 🇦🇴</h2>
                                    <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                                        Plataforma de reforço escolar e ligação a explicadores para todo o currículo angolano.
                                    </p>
                                </div>
                                <button 
                                    onClick={() => setShowWelcome(false)}
                                    className="w-full bg-accent hover:bg-accentHover text-white font-bold py-3 px-6 rounded-2xl shadow-lg transition text-xs sm:text-sm flex items-center justify-center gap-2"
                                >
                                    <span>Começar Agora</span>
                                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* BARRA SUPERIOR DE CONTROLOS (ESTILO FACEBOOK SUPERIOR) */}
                    <header className="sticky top-0 z-40 bg-primary text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 py-2 flex items-center justify-between gap-2 text-xs">
                            <div className="flex items-center gap-2 truncate">
                                <span className="relative flex h-2 w-2">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                                </span>
                                <span className="font-medium text-slate-200 truncate">Apoio Já • Angola 🇦🇴</span>
                            </div>

                            <div className="flex items-center gap-2">
                                {/* BOTÃO DE MUDAR COR (ESTILO FACEBOOK MENU FLUTUANTE) */}
                                <div className="relative">
                                    <button 
                                        onClick={() => setShowThemeMenu(!showThemeMenu)}
                                        className="bg-blue-950 hover:bg-blue-900 px-3 py-1.5 rounded-xl border border-blue-800 flex items-center gap-1.5 font-semibold text-xs transition"
                                    >
                                        <i data-lucide="palette" className="w-3.5 h-3.5 text-accent"></i>
                                        <span className="hidden sm:inline">Tema</span>
                                        <i data-lucide="chevron-down" className="w-3 h-3"></i>
                                    </button>

                                    {showThemeMenu && (
                                        <div className="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-2 z-50 space-y-1 text-xs">
                                            <div className="px-3 py-1 font-bold text-[10px] text-slate-400 uppercase tracking-wider">Aparência</div>
                                            <button onClick={() => { setTheme('light'); setShowThemeMenu(false); }} className={`w-full text-left px-3 py-2 rounded-xl flex items-center gap-2 font-medium transition ${theme === 'light' ? 'bg-amber-50 text-accent font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                                <span>☀️</span> Claro (Clean)
                                            </button>
                                            <button onClick={() => { setTheme('dark'); setShowThemeMenu(false); }} className={`w-full text-left px-3 py-2 rounded-xl flex items-center gap-2 font-medium transition ${theme === 'dark' ? 'bg-slate-800 text-accent font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                                <span>🌙</span> Escuro (Dark)
                                            </button>
                                            <button onClick={() => { setTheme('midnight'); setShowThemeMenu(false); }} className={`w-full text-left px-3 py-2 rounded-xl flex items-center gap-2 font-medium transition ${theme === 'midnight' ? 'bg-indigo-950 text-indigo-300 font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                                <span>🌌</span> Midnight Azul
                                            </button>
                                            <button onClick={() => { setTheme('sunset'); setShowThemeMenu(false); }} className={`w-full text-left px-3 py-2 rounded-xl flex items-center gap-2 font-medium transition ${theme === 'sunset' ? 'bg-orange-950 text-orange-300 font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                                <span>🌇</span> Sunset Quente
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-blue-950 p-0.5 rounded-xl flex items-center border border-blue-800 text-[11px]">
                                    <button 
                                        onClick={() => setViewMode("aluno")}
                                        className={`px-2.5 py-1 rounded-lg font-semibold transition ${viewMode === 'aluno' ? 'bg-accent text-white shadow' : 'text-slate-300'}`}
                                    >
                                        Aluno
                                    </button>
                                    <button 
                                        onClick={() => setViewMode("professor")}
                                        className={`px-2.5 py-1 rounded-lg font-semibold transition ${viewMode === 'professor' ? 'bg-accent text-white shadow' : 'text-slate-300'}`}
                                    >
                                        Prof
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* NAVBAR PRINCIPAL (RESPONSIVA) */}

                            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => navigate('home')}>
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-accent flex items-center justify-center text-white font-bold text-lg shadow-md">
                                        AJ
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-extrabold tracking-tight flex items-center gap-1">
                                            <span>Apoio</span><span className="text-accent">Já</span>
                                            <span className="text-[10px] px-1 rounded bg-amber-100 text-amber-800 font-semibold ml-0.5">AO</span>
                                        </h1>
                                        <p className="text-[9px] text-slate-500 dark:text-slate-400 -mt-1">Explicações Escolares</p>
                                    </div>
                                </div>

                                <nav className="hidden md:flex items-center gap-5 font-medium text-xs">
                                    <button onClick={() => navigate('home')} className={`hover:text-accent transition ${currentPage === 'home' ? 'text-accent font-bold' : 'text-slate-600 dark:text-slate-300'}`}>Início</button>
                                    <button onClick={() => navigate('pesquisa')} className={`hover:text-accent transition ${currentPage === 'pesquisa' ? 'text-accent font-bold' : 'text-slate-600 dark:text-slate-300'}`}>Explicadores</button>
                                    <button onClick={() => navigate('recursos')} className={`hover:text-accent transition ${currentPage === 'recursos' ? 'text-accent font-bold' : 'text-slate-600 dark:text-slate-300'}`}>Recursos</button>
                                    <button onClick={() => navigate('seguranca')} className={`hover:text-accent transition ${currentPage === 'seguranca' ? 'text-accent font-bold' : 'text-slate-600 dark:text-slate-300'}`}>Segurança</button>
                                </nav>

                                <div className="flex items-center gap-2">
                                    {viewMode === 'aluno' ? (
                                        <button 
                                            onClick={() => navigate('pedidos-aluno')}
                                            className="bg-primary text-white hover:bg-secondary px-3 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1.5"
                                        >
                                            <i data-lucide="user" className="w-3.5 h-3.5"></i>
                                            <span className="hidden sm:inline">Painel Aluno</span>
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => navigate('painel-professor')}
                                            className="bg-accent hover:bg-accentHover text-white px-3 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1.5"
                                        >
                                            <i data-lucide="briefcase" className="w-3.5 h-3.5"></i>
                                            <span className="hidden sm:inline">Painel Prof</span>
                                        </button>
                                    )}

                                    <button 
                                        onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                        className="md:hidden p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200"
                                    >
                                        <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>

                            {/* MENU MOBILE EXPANSÍVEL */}
                            {mobileMenuOpen && (
                                <div className="md:hidden px-4 py-3 border-t border-slate-200 dark:border-slate-800 space-y-2 text-xs font-semibold bg-white dark:bg-slate-900 shadow-xl">
                                    <button onClick={() => navigate('home')} className="block w-full text-left py-2 px-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Início</button>
                                    <button onClick={() => navigate('pesquisa')} className="block w-full text-left py-2 px-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Encontrar Explicadores</button>
                                    <button onClick={() => navigate('recursos')} className="block w-full text-left py-2 px-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Recursos de Estudo</button>
                                    <button onClick={() => navigate('seguranca')} className="block w-full text-left py-2 px-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Segurança & Regras</button>
                                </div>
                            )}
                        </div>
                    </header>

                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 animate-bounce">
                            <div className={`px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-white text-xs font-medium ${toast.type === 'error' ? 'bg-rose-600' : 'bg-primary border border-slate-700'}`}>
                                <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4 text-accent"></i>
                                <span>{toast.msg}</span>
                            </div>
                        </div>
                    )}

                    <main className="flex-1">
                        {currentPage === 'home' && <HomePage navigate={navigate} setSearchQueryState={setSearchQueryState} showToast={showToast} getCardBg={getCardBg} />}
                        {currentPage === 'pesquisa' && <SearchPage navigate={navigate} initialQuery={searchQueryState} showToast={showToast} getCardBg={getCardBg} />}
                        {currentPage === 'perfil' && <ProfilePage profId={selectedProfId} navigate={navigate} showToast={showToast} getCardBg={getCardBg} />}
                        {currentPage === 'pedir' && <RequestPage profId={selectedProfId} navigate={navigate} showToast={showToast} getCardBg={getCardBg} />}

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!duvida.trim()) return showToast("Descreva a sua dúvida.", "error");

                const newReq = {
                    id: `req-${Date.now()}`,
                    professorId: prof.id,
                    professorNome: prof.nome,
                    alunoNome: "Estudante Demo",
                    disciplina: prof.disciplinas[0],
                    nivel: NIVEIS_ENSINO[1],
                    duvida,
                    estado: "Pendente",
                    data: new Date().toISOString()
                };

                const requests = StorageService.get("requests", []);
                StorageService.set("requests", [newReq, ...requests]);
                showToast("Pedido enviado com sucesso!");
                navigate('pedidos-aluno');
            };

            return (
                <div className="max-w-md mx-auto px-4 py-8">
                    <div className={`rounded-2xl p-6 border space-y-4 ${getCardBg()}`}>
                        <h2 className="text-xl font-extrabold">Solicitar Ajuda a {prof.nome}</h2>
                        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                            <div>
                                <label className="block font-bold text-slate-400 mb-1 text-[10px]">Descreva a sua dúvida</label>
                                <textarea 
                                    rows="4" 
                                    value={duvida} 
                                    onChange={e => setDuvida(e.target.value)}
                                    placeholder="Ex: Preciso de ajuda com equações..."
                                    className="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-accent"
                                ></textarea>
                            </div>
                            <button type="submit" className="w-full bg-accent hover:bg-accentHover text-white font-bold py-3 rounded-xl shadow">
                                Submeter Pedido
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function StudentDashboard({ navigate, showToast, getCardBg }) {
            const requests = StorageService.get("requests", []);
            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                    <h2 className="text-2xl font-extrabold">Painel do Aluno</h2>
                    <div className="space-y-3 text-xs">
                        {requests.map(req => (
                            <div key={req.id} className={`p-4 rounded-2xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 ${getCardBg()}`}>
                                <div>
                                    <h4 className="font-bold text-sm">{req.professorNome}</h4>
                                    <p className="text-slate-400">{req.disciplina} • <span className="text-accent font-bold">{req.estado}</span></p>
                                    <p className="italic mt-1 text-[11px]">"{req.duvida}"</p>
                                </div>
                                {req.estado === 'Aceite' && (
                                    <button onClick={() => navigate('chat', req.id)} className="bg-accent text-white px-3.5 py-2 rounded-xl font-bold">
                                        Abrir Chat
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function TeacherDashboard({ navigate, showToast, getCardBg }) {
            const [requests, setRequests] = useState(() => StorageService.get("requests", []));
            const updateStatus = (id, estado) => {
                const updated = requests.map(r => r.id === id ? {...r, estado} : r);
                setRequests(updated);
                StorageService.set("requests", updated);
                showToast(`Pedido ${estado.toLowerCase()} com sucesso!`);
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                    <h2 className="text-2xl font-extrabold">Painel do Professor</h2>
                    <div className="space-y-3 text-xs">
                        {requests.map(req => (
                            <div key={req.id} className={`p-4 rounded-2xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 ${getCardBg()}`}>
                                <div>
                                    <h4 className="font-bold text-sm">Aluno: {req.alunoNome}</h4>
                                    <p className="text-slate-400">{req.disciplina} • <span className="text-accent font-bold">{req.estado}</span></p>
                                    <p className="italic mt-1 text-[11px]">"{req.duvida}"</p>
                                </div>
                                {req.estado === 'Pendente' && (
                                    <div className="flex gap-2">
                                        <button onClick={() => updateStatus(req.id, 'Aceite')} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-bold">Aceitar</button>
                                        <button onClick={() => updateStatus(req.id, 'Recusado')} className="bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold">Recusar</button>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ChatPage({ requestId, navigate, showToast, getCardBg }) {
            const allMsg = StorageService.get("messages", {});
            const [msgList, setMsgList] = useState(allMsg[requestId] || [{ id: "1", remetente: "aluno", texto: "Olá professor!", hora: "10:00" }]);
            const [input, setInput] = useState("");

            const handleSend = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                const updated = [...msgList, { id: Date.now(), remetente: "aluno", texto: input, hora: "10:02" }];
                setMsgList(updated);
                StorageService.set("messages", { ...allMsg, [requestId]: updated });
                setInput("");
            };

            return (
                <div className="max-w-2xl mx-auto px-4 py-8">
                    <div className={`rounded-2xl border flex flex-col h-[450px] ${getCardBg()}`}>
                        <div className="p-3 border-b border-slate-200 dark:border-slate-800 font-bold text-xs">Chat com Explicador</div>
                        <div className="flex-1 p-4 overflow-y-auto space-y-2.5 text-xs">
                            {msgList.map(m => (
                                <div key={m.id} className={`flex ${m.remetente === 'aluno' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-2.5 rounded-xl max-w-[80%] ${m.remetente === 'aluno' ? 'bg-primary text-white' : 'bg-slate-200 dark:bg-slate-800'}`}>
                                        {m.texto}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <form onSubmit={handleSend} className="p-3 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                            <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Escreva..." className="flex-1 bg-slate-100 dark:bg-slate-800 border rounded-xl px-3 py-2 text-xs" />
                            <button type="submit" className="bg-accent text-white px-3 py-2 rounded-xl text-xs font-bold">Enviar</button>
                        </form>
                    </div>
                </div>
            );
        }

        function ResourcesPage({ showToast, getCardBg }) {
            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-4">
                    <h2 className="text-2xl font-extrabold">Recursos de Estudo</h2>
                    <div className={`p-4 rounded-2xl border flex justify-between items-center text-xs ${getCardBg()}`}>
                        <div>
                            <h4 className="font-bold">Fórmulas de Matemática (9.ª Classe)</h4>
                            <p className="text-[11px] text-slate-400">PDF Alinhado</p>
                        </div>
                        <button onClick={() => showToast("Descarregado com sucesso!")} className="bg-primary text-white px-3.5 py-2 rounded-xl font-bold">Baixar</button>
                    </div>
                </div>
            );
        }

        function SecurityPage({ getCardBg }) {
            return (
                <div className="max-w-xl mx-auto px-4 py-8">
                    <div className={`p-6 rounded-2xl border space-y-3 text-xs ${getCardBg()}`}>
                        <h2 className="text-lg font-extrabold text-accent">Regras de Segurança</h2>
                        <p className="text-slate-400 leading-relaxed">
                            Apoio Já promove estritamente a segurança e o respeito mútuo. Aulas presenciais devem ser validadas por um encarregado de educação.
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
